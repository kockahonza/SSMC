[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmc"
version = "0.1.0"
description = "Minimal Python port of the core SSMC (Spatial Stochastic Microbial Communities) codebase"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter>=1", "seaborn", "palettable"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssmc*"]
